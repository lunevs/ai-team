name: Scheduled product profile
on:
  pull_request:
    paths:
      - 'app/product*'
      - 'app/source_policy.py'
      - 'app/product_templates/**'
      - 'scripts/profile_operator.py'
      - 'scripts/product_operator.py'
      - 'scripts/workspace_operator.py'
      - 'scripts/stage10_fixture.py'
      - 'scripts/run_stage10_checks.py'
      - '.github/workflows/product-profile.yml'
permissions:
  contents: read
jobs:
  scheduled-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real scheduled source, isolation, update and rollback
        run: |
          rm -f docs/stage10-product-check.json
          python3 scripts/run_stage10_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-profile-evidence
          path: docs/stage10-product-check.json
