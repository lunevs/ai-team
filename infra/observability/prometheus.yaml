global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: ai-team-ledger
    metrics_path: /metrics
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: [api:8000]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
rule_files: [/etc/prometheus/alerts.yaml]
